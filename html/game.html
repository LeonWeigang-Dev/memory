<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/icons/memory-favicon.png">
    <title>Memory | Game</title>
    <link rel="stylesheet" href="/src/styles/main.scss">
</head>

<body id="game-body">

    <main class="game">
        <header class="game__header">
            <!-- Linker Bereich: Punkte -->
            <div class="game__score">
                <div class="game__score-player">
                    <img src="" alt="" class="game__icon" id="player-1-icon">
                    <span class="game__name game__blue">Blue</span>
                    <span class="game__points game__blue" id="p1-points">0</span>
                </div>
                <div class="game__score-player">
                    <img src="" alt="" class="game__icon" id="player-2-icon">
                    <span class="game__name game__orange">Orange</span>
                    <span class="game__points game__orange" id="p2-points">0</span>
                </div>
            </div>

            <!-- Mittlerer Bereich: Aktueller Spieler -->
            <div class="game__current">
                Current player: <img src="" alt="" class="game__icon" id="current-player-icon">
            </div>

            <!-- Rechter Bereich: Exit Button -->
            <button class="game__exit-btn" id="btn-show-exit">
                <img src="" alt="" class="game__icon" id="exit-icon">
            </button>
        </header>

        <!-- Das Grid für die Karten -->
        <section id="game-grid" class="game__grid"></section>
    </main>

    <!-- Der Exit Game Dialog -->
    <dialog id="exit-dialog" class="dialog">
        <div class="dialog__content">
            <p class="dialog__text">Are you sure you want to quit the game?</p>
            <div class="dialog__actions">
                <button class="dialog__btn dialog__btn--primary" id="btn-resume">
                    <span class="dialog__btn-text">Back to game</span>
                </button>
                <button class="dialog__btn dialog__btn--secondary" id="btn-exit">
                    Exit game
                </button>
            </div>
        </div>
    </dialog>



    <!-- ENDSCREEN OVERLAY -->
<div id="end-overlay" class="end-overlay hidden">
    
    <!-- PHASE 1: Game Over & Scores -->
    <div id="end-phase-1" class="end-phase">
        <h1 class="end-title-gameover">GAME OVER</h1>
        <div class="score-container">
            <p>Final score</p>
            <div class="score-box">
                <!-- Die Icons hier kannst du später mit deinen echten Pfaden anpassen -->
                <span class="score-player"><img src="/icons/code-vibes-theme/player-label-blue.png" id="end-p1-icon" alt="P1"> <span id="final-score-p1">0</span></span>
                <span class="score-player"><img src="/icons/code-vibes-theme/player-label-orange.png" id="end-p2-icon" alt="P2"> <span id="final-score-p2">0</span></span>
            </div>
        </div>
    </div>

    <!-- PHASE 2: Winner / Draw -->
    <div id="end-phase-2" class="end-phase hidden">
        <div id="confetti-bg" class="confetti-bg"></div> <!-- Wird nur im Code-Theme genutzt -->
        
        <p id="winner-subtitle" class="winner-subtitle">The winner is</p>
        <h1 id="winner-title" class="winner-title">ORANGE PLAYER</h1>
        
        <div class="winner-icon-wrapper">
            <img id="winner-icon" class="winner-icon-img" src="" alt="Winner / Draw Icon">
        </div>
        
        <button id="btn-home" class="btn-home">Home</button>
    </div>

</div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
