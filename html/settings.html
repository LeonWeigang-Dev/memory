<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/icons/memory-favicon.png">
    <title>Memory | Settings</title>
    <link rel="stylesheet" href="/src/styles/main.scss">
</head>

<body>

    <main class="settings">
        <h1 class="settings__title">Settings</h1>

        <form id="settings-form" class="settings__form">

            <!-- NEU: Wrapper für das 2-Spalten Layout (Links Optionen, Rechts Vorschau) -->
            <div class="settings__content-wrapper">

                <section class="settings__options">
                    <!-- Auswahl: Themes (mit Zusatzklasse für den gelben Pfeil) -->
                    <fieldset class="settings__group settings__group--themes">
                        <legend class="settings__legend">
                            <img src="/icons/setting-theme-icon.png" alt="" aria-hidden="true"> Game themes
                        </legend>
                        <div class="settings__radio">
                            <input type="radio" id="theme-code" name="theme" value="code-vibes" checked>
                            <label for="theme-code">Code vibes theme</label>
                        </div>
                        <div class="settings__radio">
                            <input type="radio" id="theme-food" name="theme" value="foods">
                            <label for="theme-food">Food theme</label>
                        </div>
                    </fieldset>

                    <!-- Auswahl: Spielerfarbe -->
                    <fieldset class="settings__group">
                        <legend class="settings__legend">
                            <img src="/icons/setting-player-icon.png" alt="" aria-hidden="true"> Choose player
                        </legend>
                        <div class="settings__radio">
                            <input type="radio" id="player-blue" name="player" value="blue">
                            <label for="player-blue">Blue</label>
                        </div>
                        <div class="settings__radio">
                            <input type="radio" id="player-orange" name="player" value="orange">
                            <label for="player-orange">Orange</label>
                        </div>
                    </fieldset>

                    <!-- Auswahl: Spielfeldgröße -->
                    <fieldset class="settings__group">
                        <legend class="settings__legend">
                            <img src="/icons/setting-board-icon.png" alt="" aria-hidden="true"> Board size
                        </legend>
                        <div class="settings__radio">
                            <input type="radio" id="size-16" name="boardSize" value="16">
                            <label for="size-16">16 cards</label>
                        </div>
                        <div class="settings__radio">
                            <input type="radio" id="size-24" name="boardSize" value="24">
                            <label for="size-24">24 cards</label>
                        </div>
                        <div class="settings__radio">
                            <input type="radio" id="size-36" name="boardSize" value="36">
                            <label for="size-36">36 cards</label>
                        </div>
                    </fieldset>
                </section>

                <!-- Rechte Seite: Vorschau-Bild -->
                <aside class="settings__preview">
                    <img src="/imgs/preview-code-vibes.png" id="theme-preview-img" alt="Theme Preview">
                </aside>

            </div> <!-- Ende Wrapper -->

            <!-- Footer: Zusammenfassung & Start-Button -->
            <footer class="settings__footer">
                <p class="settings__summary">
                    <span id="summary-theme">Game theme</span> <span class="settings__slash">/</span>
                    <span id="summary-player">Player</span> <span class="settings__slash">/</span>
                    <span id="summary-size">Board size</span>
                </p>
                <button type="submit" class="settings__submit-btn" id="start-btn" disabled>
                    <img src="/icons/start-btn.png" alt="Start Game">
                </button>
            </footer>

        </form>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
