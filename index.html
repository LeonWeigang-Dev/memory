<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/icons/memory-favicon.png">
    <title>Memory | Home</title>
    <link rel="stylesheet" href="/src/styles/components/_button.scss">
    <link rel="stylesheet" href="/src/styles/pages/_endcard.scss">
    <link rel="stylesheet" href="/src/styles/pages/_game.scss">
    <link rel="stylesheet" href="/src/styles/pages/_settings.scss">
    <link rel="stylesheet" href="/src/styles/pages/_home.scss">
    <link rel="stylesheet" href="/src/styles/main.scss">
</head>

<body>

    <main class="home-screen">
        <section class="home-screen__content">

            <figure class="home-screen__logo">
                <img src="/icons/background-controller.png" alt="Animiertes Game Controller Icon"
                    class="home-screen__controller-icon">
            </figure>

            <div class="home-screen__text">
                <p class="home-screen__subtitle">It's play time.</p>
                <h1 class="home-screen__title">Ready to play?</h1>
            </div>

            <!-- Start-Button als Bild mit Hover-Effekt -->
            <a href="./html/settings.html" class="start-btn">
                <img src="/icons/start-play-btn.png" alt="Spiel Starten"
                    class="start-btn__img start-btn__img--default">
                <img src="/icons/start-play-btn-hover.png" alt="" class="start-btn__img start-btn__img--hover"
                    aria-hidden="true">
            </a>

        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
